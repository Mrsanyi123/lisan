<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lisan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Nunito", "sans-serif"],
            },
            colors: {
              nova: {
                primary: "#2563EB", // Vibrant Blue
                primaryDark: "#1D4ED8", // Darker Blue
                secondary: "#1E293B", // Dark Slate / Black
                secondaryDark: "#0F172A", // Darker Slate
                accent: "#38BDF8", // Sky Blue
                accentDark: "#0284C7", // Darker Sky
                bg: "#F8FAFC", // Very light blue-gray background
                text: "#0F172A", // Very dark text
                gray: "#E2E8F0", // Light gray for borders
              },
            },
            animation: {
              "bounce-slow": "bounce 3s infinite",
              "spin-slow": "spin 3s linear infinite",
            },
          },
        },
      };
    </script>
    <style>
      body {
        background-color: #0f172a; /* Dark fallback */
        -webkit-tap-highlight-color: transparent;
      }
      /* Custom scrollbar for webkit */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1e293b;
      }
      ::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #475569;
      }

      /* Markdown Styles for Chat */
      .prose p {
        margin-bottom: 0.5rem;
      }
      .prose p:last-child {
        margin-bottom: 0;
      }
      .prose strong {
        font-weight: 800;
      }
      .prose ul {
        list-style-type: disc;
        padding-left: 1.2rem;
        margin-bottom: 0.5rem;
      }
      .prose ol {
        list-style-type: decimal;
        padding-left: 1.2rem;
        margin-bottom: 0.5rem;
      }
      .prose li {
        margin-bottom: 0.2rem;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
